<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>API Security Monitor</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; }

    header {
      background: #1a1d27; padding: 20px 32px;
      border-bottom: 1px solid #2a2d3e;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 1.3rem; color: #7c83fd; letter-spacing: 1px; }
    #status-bar { font-size: 0.8rem; color: #888; }
    #status-bar span { color: #7c83fd; }

    .summary {
      display: flex; gap: 16px; padding: 24px 32px; flex-wrap: wrap;
    }
    .card {
      background: #1a1d27; border-radius: 10px; padding: 20px 28px;
      flex: 1; min-width: 140px; border: 1px solid #2a2d3e;
    }
    .card .label { font-size: 0.75rem; color: #888; text-transform: uppercase; margin-bottom: 8px; }
    .card .value { font-size: 2rem; font-weight: bold; }
    .critical { color: #ff4d4d; }
    .high     { color: #ff8c00; }
    .medium   { color: #ffd700; }
    .pass     { color: #4caf50; }
    .error    { color: #aaa; }

    .controls { padding: 0 32px 16px; display: flex; gap: 12px; align-items: center; }
    button {
      background: #7c83fd; color: #fff; border: none;
      padding: 9px 20px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }
    button:hover { background: #6066e0; }
    #scan-btn.scanning { background: #444; cursor: not-allowed; }

    .filter-bar { display: flex; gap: 8px; }
    .filter-btn {
      background: #1a1d27; border: 1px solid #2a2d3e; color: #aaa;
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
    }
    .filter-btn.active { border-color: #7c83fd; color: #7c83fd; }

    table { width: calc(100% - 64px); margin: 0 32px 32px; border-collapse: collapse; }
    th {
      background: #1a1d27; color: #888; font-size: 0.75rem;
      text-transform: uppercase; padding: 12px 16px; text-align: left;
      border-bottom: 1px solid #2a2d3e;
    }
    td { padding: 13px 16px; border-bottom: 1px solid #1e2130; font-size: 0.875rem; }
    tr:hover td { background: #1a1d27; }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 12px;
      font-size: 0.75rem; font-weight: 600;
    }
    .badge.CRITICAL { background: #3a1a1a; color: #ff4d4d; }
    .badge.HIGH     { background: #2e1e00; color: #ff8c00; }
    .badge.MEDIUM   { background: #2e2800; color: #ffd700; }
    .badge.PASS     { background: #0f2a15; color: #4caf50; }
    .badge.ERROR    { background: #222; color: #aaa; }

    #live-dot {
      display: inline-block; width: 8px; height: 8px;
      background: #4caf50; border-radius: 50; margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    .empty { text-align: center; color: #555; padding: 48px; }
  </style>
</head>
<body>

<header>
  <h1>🛡 API Security Monitor</h1>
  <div id="status-bar">
  <span id="live-dot"></span>
  Target: <span id="target-name">—</span> &nbsp;|&nbsp;
  Last scan: <span id="last-scan">—</span> &nbsp;|&nbsp;
  Endpoints: <span id="endpoint-count">—</span> &nbsp;|&nbsp;
  Discovery: <span id="discovery-mode">—</span>
</div>
</header>

<div class="summary">
  <div class="card"><div class="label">Total Checks</div><div class="value" id="cnt-total">0</div></div>
  <div class="card"><div class="label">Critical</div><div class="value critical" id="cnt-critical">0</div></div>
  <div class="card"><div class="label">High</div><div class="value high" id="cnt-high">0</div></div>
  <div class="card"><div class="label">Medium</div><div class="value medium" id="cnt-medium">0</div></div>
  <div class="card"><div class="label">Passed</div><div class="value pass" id="cnt-pass">0</div></div>
</div>

<div class="controls">
  <div style="display:flex; gap:8px; align-items:center; flex:1;">
    <input
      id="url-input"
      type="text"
      placeholder="Enter target URL (e.g. http://localhost:8888) or leave blank for default"
      style="flex:1; background:#1a1d27; border:1px solid #2a2d3e; color:#e0e0e0;
             padding:8px 14px; border-radius:6px; font-size:0.85rem; outline:none;"
    />
    <button id="scan-btn" onclick="triggerScan()">⚡ Scan Now</button>
  </div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('ALL', this)">All</button>
    <button class="filter-btn" onclick="setFilter('CRITICAL', this)">Critical</button>
    <button class="filter-btn" onclick="setFilter('HIGH', this)">High</button>
    <button class="filter-btn" onclick="setFilter('MEDIUM', this)">Medium</button>
    <button class="filter-btn" onclick="setFilter('PASS', this)">Passed</button>
  </div>
  <div style="margin-left:auto; display:flex; gap:8px;">
    <button onclick="exportJSON()" style="background:#2a2d3e; border:1px solid #444;">⬇ JSON</button>
    <button onclick="exportPDF()" style="background:#2a2d3e; border:1px solid #444;">⬇ PDF</button>
  </div>
</div>
</div>

<table>
  <thead>
    <tr>
      <th>Check</th><th>Endpoint</th><th>Method</th><th>Severity</th><th>Detail</th>
    </tr>
  </thead>
  <tbody id="findings-body">
    <tr><td colspan="5" class="empty">Waiting for scan results...</td></tr>
  </tbody>
</table>

<script>
  const socket = io();
  let allFindings = [];
  let activeFilter = "ALL";

  socket.on("scan_update", data => renderResults(data));

  fetch("/api/results").then(r => r.json()).then(data => {
    if (data.findings.length) renderResults(data);
  });

  function renderResults(data) {
    allFindings = data.findings || [];
    document.getElementById("target-name").textContent = data.target || "—";
    document.getElementById("last-scan").textContent = data.last_scan || "—";

    const counts = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, PASS: 0, ERROR: 0 };
    allFindings.forEach(f => { if (counts[f.severity] !== undefined) counts[f.severity]++; });

    document.getElementById("cnt-total").textContent = allFindings.length;
    document.getElementById("cnt-critical").textContent = counts.CRITICAL;
    document.getElementById("cnt-high").textContent = counts.HIGH;
    document.getElementById("cnt-medium").textContent = counts.MEDIUM;
    document.getElementById("cnt-pass").textContent = counts.PASS;
    document.getElementById("endpoint-count").textContent = data.endpoint_count || "—";
    document.getElementById("discovery-mode").textContent = data.discovery_mode || "—";

    renderTable();
  }

  function renderTable() {
    const filtered = activeFilter === "ALL"
      ? allFindings
      : allFindings.filter(f => f.severity === activeFilter);

    const tbody = document.getElementById("findings-body");
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty">No findings for this filter.</td></tr>`;
      return;
    }
    tbody.innerHTML = filtered.map(f => `
      <tr>
        <td>${f.check}</td>
        <td><code>${f.endpoint}</code></td>
        <td>${f.method}</td>
        <td><span class="badge ${f.severity}">${f.severity}</span></td>
        <td>${f.detail}</td>
      </tr>
    `).join("");
  }

  function setFilter(val, btn) {
    activeFilter = val;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderTable();
  }

  function triggerScan() {
    const btn = document.getElementById("scan-btn");
    const url = document.getElementById("url-input").value.trim();
    btn.textContent = "Scanning...";
    btn.classList.add("scanning");
    btn.disabled = true;
    const endpoint = url ? `/api/scan?url=${encodeURIComponent(url)}` : "/api/scan";
    fetch(endpoint).then(async (res) => {
      if (!res.ok) {
        // show error message from server when available
        try {
          const body = await res.json();
          alert(body.error || 'Scan request failed');
          // Re-enable button if scan request failed
          btn.textContent = "⚡ Scan Now";
          btn.classList.remove("scanning");
          btn.disabled = false;
        } catch (e) {
          alert('Scan request failed');
          btn.textContent = "⚡ Scan Now";
          btn.classList.remove("scanning");
          btn.disabled = false;
        }
      }
    }).catch(() => {
      alert('Failed to contact scan endpoint');
      btn.textContent = "⚡ Scan Now";
      btn.classList.remove("scanning");
      btn.disabled = false;
    });
  }
  socket.on("scan_update", data => {
  renderResults(data);
  const btn = document.getElementById("scan-btn");
  btn.textContent = "⚡ Scan Now";
  btn.classList.remove("scanning");
  btn.disabled = false;
  fetch("/api/history").then(r => r.json()).then(renderHistory);
  });
  function exportJSON() {
  fetch("/api/export/json")
    .then(r => r.json())
    .then(d => alert("Saved to: " + d.file));
  }

  function exportPDF() {
  window.location.href = "/api/export/pdf";
  }
</script>
<div style="padding: 0 32px 16px; display:flex; justify-content:space-between; align-items:center;">
  <h2 style="font-size:1rem; color:#888;">Scan History</h2>
  <span style="font-size:0.8rem; color:#555;">Last 10 scans</span>
</div>

<table id="history-table" style="width: calc(100% - 64px); margin: 0 32px 48px; border-collapse: collapse;">
  <thead>
    <tr>
      <th style="background:#1a1d27;color:#888;font-size:.75rem;text-transform:uppercase;padding:12px 16px;text-align:left;border-bottom:1px solid #2a2d3e;">Scan #</th>
      <th style="background:#1a1d27;color:#888;font-size:.75rem;text-transform:uppercase;padding:12px 16px;text-align:left;border-bottom:1px solid #2a2d3e;">Timestamp</th>
      <th style="background:#1a1d27;color:#888;font-size:.75rem;text-transform:uppercase;padding:12px 16px;text-align:left;border-bottom:1px solid #2a2d3e;">Critical</th>
      <th style="background:#1a1d27;color:#888;font-size:.75rem;text-transform:uppercase;padding:12px 16px;text-align:left;border-bottom:1px solid #2a2d3e;">High</th>
      <th style="background:#1a1d27;color:#888;font-size:.75rem;text-transform:uppercase;padding:12px 16px;text-align:left;border-bottom:1px solid #2a2d3e;">Medium</th>
      <th style="background:#1a1d27;color:#888;font-size:.75rem;text-transform:uppercase;padding:12px 16px;text-align:left;border-bottom:1px solid #2a2d3e;">Total</th>
    </tr>
  </thead>
  <tbody id="history-body">
    <tr><td colspan="6" class="empty">No history yet</td></tr>
  </tbody>
</table>

<script>
  // Load history on page load
  fetch("/api/history").then(r => r.json()).then(renderHistory);

  function renderHistory(history) {
    const tbody = document.getElementById("history-body");
    if (!history.length) return;
    const last10 = history.slice(-10).reverse();
    tbody.innerHTML = last10.map((h, i) => `
      <tr>
        <td style="padding:13px 16px;border-bottom:1px solid #1e2130;font-size:.875rem;">#${history.length - i}</td>
        <td style="padding:13px 16px;border-bottom:1px solid #1e2130;font-size:.875rem;">${h.timestamp}</td>
        <td style="padding:13px 16px;border-bottom:1px solid #1e2130;font-size:.875rem;color:#ff4d4d;">${h.summary.critical}</td>
        <td style="padding:13px 16px;border-bottom:1px solid #1e2130;font-size:.875rem;color:#ff8c00;">${h.summary.high}</td>
        <td style="padding:13px 16px;border-bottom:1px solid #1e2130;font-size:.875rem;color:#ffd700;">${h.summary.medium}</td>
        <td style="padding:13px 16px;border-bottom:1px solid #1e2130;font-size:.875rem;">${h.summary.total}</td>
      </tr>
    `).join("");
  }

  // Update history when new scan comes in
  socket.on("scan_update", () => {
    fetch("/api/history").then(r => r.json()).then(renderHistory);
  });
</script>
</body>
</html>
